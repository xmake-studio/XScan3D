; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico
framework = arduino

board_build.core = earlephilhower
; USB product string the host UI recognises the scanner by (tools/device_detect.py).
; Other RP2040 boards report "Pico" and are left alone.
board_build.arduino.earlephilhower.usb_product = XScan3D

upload_protocol = picotool
upload_speed = 115200
monitor_speed = 115200
extra_scripts = upload_script.py
lib_deps =
    https://github.com/adafruit/Adafruit_NeoPixel.git